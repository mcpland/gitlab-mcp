name: Node CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm audit --prod --audit-level=high

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.18.1", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env:
          CI: true

  packaging:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify packed consumer install and HTTP binary
        shell: bash
        run: |
          pnpm build
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          consumer="$RUNNER_TEMP/gitlab-mcp-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP/$tarball"
          test -x node_modules/.bin/gitlab-mcp
          test -x node_modules/.bin/gitlab-mcp-http
          GITLAB_PERSONAL_ACCESS_TOKEN=consumer-smoke \
            HTTP_PORT=3344 \
            node_modules/.bin/gitlab-mcp-http >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3344/healthz >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat server.log
          exit 1
      - name: Verify Docker image starts
        shell: bash
        run: |
          docker build --tag gitlab-mcp:ci .
          test "$(docker image inspect --format '{{.Config.User}}' gitlab-mcp:ci)" = "node"
          container_id="$(docker run --detach --rm \
            --env REMOTE_AUTHORIZATION=true \
            --env HTTP_HOST=0.0.0.0 \
            --env MCP_ALLOWED_HOSTS=127.0.0.1 \
            --publish 3333:3333 \
            gitlab-mcp:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3333/healthz >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs "$container_id"
          exit 1
