name: Node.js Package

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf 'Expected release tag %s but received %s\n' "$expected_tag" "$RELEASE_TAG" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
      - run: pnpm test
      - name: Verify packed consumer install and HTTP binary
        shell: bash
        run: |
          pnpm build
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          consumer="$RUNNER_TEMP/gitlab-mcp-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP/$tarball"
          test -x node_modules/.bin/gitlab-mcp
          test -x node_modules/.bin/gitlab-mcp-http
          GITLAB_PERSONAL_ACCESS_TOKEN=consumer-smoke \
            HTTP_PORT=3344 \
            node_modules/.bin/gitlab-mcp-http >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3344/healthz >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat server.log
          exit 1
      - run: npm publish --access public --provenance
